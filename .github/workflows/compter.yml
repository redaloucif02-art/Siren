name: Compter les agences

on:
  workflow_dispatch:

jobs:
  compter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compter
        run: |
          python compter_agences.py | tee resultat.txt
          {
            echo '## Comptage des agences'
            echo '```'
            cat resultat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
