name: Analyse enseignes et réseaux

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyser
        run: |
          python analyse_enseignes.py | tee resultat.txt
          {
            echo '## Enseignes et réseaux'
            echo '```'
            cat resultat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add enseignes_reseaux.csv societes_reseaux.csv
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Enseignes et réseaux"
            git push
          fi
