name: filtre-agences
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python filtre_agences.py
      - if: always()
        run: |
          git config user.name "github-actions"
          git add agences_filtrees.csv traites.txt
          git config user.email "actions@github.com"
          git commit -m "filtre agences" || exit 0
          git push
