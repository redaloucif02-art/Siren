name: Rapprochement (meilleure fiche par agence)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rapprochement
        run: |
          python scripts/match_places.py | tee data/match_report.txt
          { echo '```'; cat data/match_report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer les résultats dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/agences_enrichies.csv data/a_revoir.csv data/match_report.txt
          git diff --cached --quiet && exit 0
          git commit -m "data: agences enrichies"
          git pull --rebase --autostash
          git push
