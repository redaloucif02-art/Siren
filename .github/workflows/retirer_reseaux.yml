name: Retirer les réseaux

on:
  workflow_dispatch:
    inputs:
      avec_nom:
        description: "Retirer aussi ceux dont le nom contient un réseau (true/false)"
        required: false
        default: "false"
      min:
        description: "Enseigne retirée si elle est sur N sociétés ou plus (1 = toutes)"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  retirer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retirer
        env:
          AVEC_NOM: ${{ github.event.inputs.avec_nom }}
          MIN: ${{ github.event.inputs.min }}
        run: |
          OPTS="--min $MIN"
          if [ "$AVEC_NOM" = "true" ]; then OPTS="$OPTS --avec-nom"; fi
          python retirer_reseaux.py $OPTS | tee resultat.txt
          {
            echo '## Retrait des réseaux'
            echo '```'
            cat resultat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agences_sans_reseau.csv agences_reseau_retirees.csv
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Agences sans réseau"
            git push
          fi
