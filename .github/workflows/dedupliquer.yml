name: Dédoublonner les agences

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dedupliquer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fusionner (1 ligne par SIREN, sans gérant vide)
        run: |
          python dedupliquer.py | tee resultat.txt
          {
            echo '## Dédoublonnage des agences'
            echo '```'
            cat resultat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agences_uniques.csv
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Agences uniques avec gérant"
            git push
          fi
