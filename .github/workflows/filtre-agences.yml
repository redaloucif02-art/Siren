name: filtre-agences
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "normal ou retry (reprend erreurs_429.csv)"
        default: "normal"
      limit:
        description: "Nb de SIREN (0 = tous)"
        default: "0"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python filtre_agences.py
        env:
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add agences_filtrees.csv traites.txt erreurs_429.csv
          git commit -m "filtre agences" || exit 0
          git pull --rebase
          git push
