name: Scrape agences Century 21

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre max d'agences à traiter (0 = toutes, utile pour tester avec 10)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tesseract : l'email des agences est publié sous forme d'image
      - name: Installer tesseract (OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Installer les dépendances Python
        run: pip install requests beautifulsoup4 pillow pytesseract

      - name: Lancer le scrape Century 21
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: python scrape_century21.py

      # always() : on sauvegarde la progression même si le job plante ou time out
      - name: Commit du CSV sur main
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agences_century21.csv
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Mise à jour agences_century21.csv"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
