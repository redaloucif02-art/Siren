name: Contrôle des résultats (check_places)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyse
        run: |
          python scripts/check_places.py | tee data/check_report.txt
          { echo '```'; cat data/check_report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer le rapport dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/check_report.txt data/check_non_immo.csv data/check_sans_immo.csv
          git diff --cached --quiet && exit 0
          git commit -m "data: rapport de contrôle"
          git pull --rebase --autostash
          git push
