name: Compter les enseignes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enseignes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyser les enseignes
        run: |
          python enseignes.py | tee resultat.txt
          {
            echo '## Enseignes'
            echo '```'
            cat resultat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add enseignes.csv
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Liste des enseignes"
            git push
          fi
