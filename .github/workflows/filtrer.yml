name: Retirer les fiches hors immobilier

on:
  workflow_dispatch:
    inputs:
      large:
        description: "Garder tous les types immobiliers (agent, syndic, promoteur...) et pas seulement « Agence immobilière »"
        type: boolean
        default: false
      inplace:
        description: "Remplacer data/places.jsonl (original sauvegardé dans places_original.jsonl)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  filtrer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Filtrage
        run: |
          ARGS=""
          [ "${{ inputs.large }}" = "true" ] && ARGS="$ARGS --large"
          [ "${{ inputs.inplace }}" = "true" ] && ARGS="$ARGS --inplace"
          python scripts/filtrer_fiches_immo.py $ARGS | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: fiches hors immobilier retirées"
          git pull --rebase --autostash
          git push
