name: Scrape détails agences Orpi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Lancer le scrape des détails
        run: python scrape_orpi_details.py

      # always() : on sauvegarde la progression même si le job plante ou time out
      - name: Commit du CSV sur main
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agences_orpi_details.csv
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Mise à jour agences_orpi_details.csv"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
