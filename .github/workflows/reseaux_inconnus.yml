name: Voir / supprimer les réseaux absents de ma liste

on:
  workflow_dispatch:
    inputs:
      min_agences:
        description: "Nombre minimum d'agences différentes"
        default: "4"
      min_dep:
        description: "Nombre minimum de départements différents"
        default: "3"
      supprimer:
        description: "Supprimer réellement les agences de ces réseaux (sinon simulation)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  inconnus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyse
        run: |
          python scripts/voir_reseaux_inconnus.py --min-agences "${{ inputs.min_agences || 4 }}" --min-dep "${{ inputs.min_dep || 3 }}" ${{ inputs.supprimer && '--supprimer' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer le CSV dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reseaux_candidats.csv data/reseaux_supprimes.csv data/*.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "data: réseaux candidats / suppression"
          git pull --rebase --autostash
          git push
          
