name: Ajouter le nom commercial

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nom-commercial:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configurer git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Récupérer les noms commerciaux (INSEE)
        env:
          INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
        run: python ajouter_nom_commercial.py --push
