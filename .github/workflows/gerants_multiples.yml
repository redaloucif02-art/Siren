name: Gérants dans plusieurs sociétés

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyser
        run: |
          python gerants_multiples.py | tee resultat.txt
          {
            echo '## Gérants dans plusieurs sociétés'
            echo '```'
            cat resultat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gerants_multiples.csv
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Gérants présents dans plusieurs sociétés"
            git push
          fi
